<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SENA ACCESS - Control de Acceso CCyS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #07090D;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(2, 217, 20, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(2, 217, 20, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-container {
            width: 160px;
            height: 160px;
            margin: 0 auto 24px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(2, 217, 20, 0.12) 0%, transparent 70%);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .logo-container img {
            width: 140px;
            height: auto;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 0 20px rgba(2, 217, 20, 0.2));
        }

        .scan-line {
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #02D914, transparent);
            margin: 0 auto 20px;
            border-radius: 2px;
            animation: scanMove 2s ease-in-out infinite;
        }

        @keyframes scanMove {
            0% { transform: scaleX(0.3); opacity: 0; }
            50% { transform: scaleX(1); opacity: 1; }
            100% { transform: scaleX(0.3); opacity: 0; }
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            background: linear-gradient(135deg, #02D914 0%, #00E81A 50%, #66FF78 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .card {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.05) 0%,
                rgba(255, 255, 255, 0.02) 100%
            );
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(2, 217, 20, 0.15);
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            box-shadow: 0 0 40px rgba(2, 217, 20, 0.05);
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px 32px;
            background: linear-gradient(135deg, #02D914 0%, #00BD11 100%);
            color: #07090D;
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 30px rgba(2, 217, 20, 0.3);
        }

        .btn-download:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 50px rgba(2, 217, 20, 0.4);
        }

        .btn-download:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-download svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .version {
            display: inline-block;
            margin-top: 20px;
            padding: 4px 14px;
            border: 1px solid rgba(2, 217, 20, 0.2);
            border-radius: 20px;
            font-size: 0.7rem;
            color: rgba(2, 217, 20, 0.5);
            letter-spacing: 0.05em;
        }

        .footer {
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.7rem;
            letter-spacing: 0.05em;
        }

        @media (max-width: 500px) {
            .container { padding: 24px 16px; }
            h1 { font-size: 2.2rem; }
            .logo-container { width: 120px; height: 120px; }
            .logo-container::before { width: 160px; height: 160px; }
            .logo-container img { width: 100px; }
            .card { padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="https://www.sena.edu.co/Style%20Library/alayout/images/logoSena.png?rev=40" alt="SENA" />
        </div>

        <div class="scan-line"></div>

        <h1>SENA ACCESS</h1>
        <p class="subtitle">Control de Acceso CCyS</p>

        <div class="card">
            <a href="SenaAccess.apk" class="btn-download" download="SenaAccess.apk">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Descargar APK
            </a>
            <div class="version">v1.6 &mdash; actualizada 12/09/2026</div>
        </div>

        <div class="footer">SENA &mdash; Centro de Comercio y Servicios</div>
    </div>
</body>
</html>
